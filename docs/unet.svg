<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="u" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
    <style>
      .blk{fill:#e0f2fe;stroke:#0284c7;stroke-width:1.5}
      .bot{fill:#fef3c7;stroke:#d97706;stroke-width:1.5}
      .ch{font-size:15px;font-weight:700;fill:#0f172a}
      .sz{font-size:11px;fill:#334155}
      .k{font-size:11px;fill:#64748b}
      .h{font-size:17px;font-weight:700;fill:#0f172a}
      .pool{stroke:#dc2626;stroke-width:2;fill:none;marker-end:url(#d)}
      .up{stroke:#16a34a;stroke-width:2;fill:none;marker-end:url(#u)}
      .skip{stroke:#64748b;stroke-width:1.5;fill:none;stroke-dasharray:5 4;marker-end:url(#g)}
      .io{stroke:#0f172a;stroke-width:1.8;fill:none;marker-end:url(#g)}
    </style>
  </defs>
  <rect width="960" height="560" fill="#ffffff"/>
  <text class="h" x="20" y="30">Stage 1: anisotropic 3D U-Net (22.5 M parameters)</text>
  <text class="sz" x="20" y="50">every block = (3D conv, instance norm, LeakyReLU) x 2; sizes are z x y x x voxels of a 0.5 x 0.5 x 1 mm grid</text>

  <!-- input -->
  <rect x="20" y="78" width="90" height="56" rx="6" fill="#f1f5f9" stroke="#475569"/>
  <text class="ch" x="30" y="100">input</text><text class="sz" x="30" y="116">2 channels:</text><text class="sz" x="30" y="129">image, FRST</text>
  <path class="io" d="M110,106 L138,106"/>
  <text class="k" x="20" y="150">patch 38 x 62 x 94</text><text class="k" x="20" y="163">(padded to 40 x 64 x 96)</text>

  <!-- encoder -->
  <rect class="blk" x="140" y="76" width="70" height="60" rx="6"/><text class="ch" x="160" y="102">32</text><text class="sz" x="146" y="122">40 x 64 x 96</text>
  <rect class="blk" x="200" y="186" width="80" height="60" rx="6"/><text class="ch" x="225" y="212">64</text><text class="sz" x="210" y="232">40 x 32 x 48</text>
  <rect class="blk" x="270" y="296" width="90" height="60" rx="6"/><text class="ch" x="298" y="322">128</text><text class="sz" x="285" y="342">20 x 16 x 24</text>
  <rect class="blk" x="350" y="406" width="100" height="60" rx="6"/><text class="ch" x="382" y="432">256</text><text class="sz" x="368" y="452">10 x 8 x 12</text>
  <rect class="bot" x="430" y="480" width="110" height="60" rx="6"/><text class="ch" x="466" y="506">512</text><text class="sz" x="458" y="526">5 x 4 x 6</text>

  <!-- decoder -->
  <rect class="blk" x="520" y="406" width="100" height="60" rx="6"/><text class="ch" x="552" y="432">256</text><text class="sz" x="538" y="452">10 x 8 x 12</text>
  <rect class="blk" x="610" y="296" width="90" height="60" rx="6"/><text class="ch" x="638" y="322">128</text><text class="sz" x="625" y="342">20 x 16 x 24</text>
  <rect class="blk" x="690" y="186" width="80" height="60" rx="6"/><text class="ch" x="715" y="212">64</text><text class="sz" x="700" y="232">40 x 32 x 48</text>
  <rect class="blk" x="760" y="76" width="70" height="60" rx="6"/><text class="ch" x="780" y="102">32</text><text class="sz" x="766" y="122">40 x 64 x 96</text>

  <!-- output -->
  <path class="io" d="M830,106 L858,106"/>
  <rect x="860" y="78" width="85" height="56" rx="6" fill="#f1f5f9" stroke="#475569"/>
  <text class="ch" x="870" y="100">output</text><text class="sz" x="870" y="116">1x1x1 conv,</text><text class="sz" x="870" y="129">p(microbleed)</text>

  <!-- pooling / upsampling -->
  <path class="pool" d="M175,136 L215,184"/><text class="k" x="214" y="152">max-pool 1x2x2</text><text class="k" x="214" y="165">(in-plane only)</text>
  <path class="pool" d="M240,246 L285,294"/><text class="k" x="168" y="280">max-pool 2x2x2</text>
  <path class="pool" d="M315,356 L365,404"/><text class="k" x="238" y="390">max-pool 2x2x2</text>
  <path class="pool" d="M400,466 L450,478"/><text class="k" x="318" y="492">max-pool 2x2x2</text>
  <path class="up" d="M520,478 L560,468"/><text class="k" x="545" y="492">up-conv 2x2x2</text>
  <path class="up" d="M575,404 L635,358"/><text class="k" x="612" y="390">up-conv 2x2x2</text>
  <path class="up" d="M660,294 L715,248"/><text class="k" x="690" y="280">up-conv 2x2x2</text>
  <path class="up" d="M735,184 L785,138"/><text class="k" x="770" y="168">up-conv 1x2x2</text>

  <!-- skips -->
  <path class="skip" d="M210,100 L758,100"/>
  <path class="skip" d="M280,210 L688,210"/>
  <path class="skip" d="M360,320 L608,320"/>
  <path class="skip" d="M450,430 L518,430"/>
  <text class="k" x="430" y="94">skip connection (concatenate)</text>

  <!-- kernels -->
  <text class="k" x="140" y="70">conv 1x3x3</text><text class="k" x="760" y="70">conv 1x3x3</text>
  <text class="k" x="405" y="262">conv 3x3x3 on all deeper levels</text>

  <!-- legend -->
  <line x1="600" y1="520" x2="630" y2="520" class="pool"/><text class="sz" x="636" y="524">down-sampling</text>
  <line x1="740" y1="520" x2="770" y2="520" class="up"/><text class="sz" x="776" y="524">up-sampling</text>
  <line x1="600" y1="542" x2="630" y2="542" class="skip"/><text class="sz" x="636" y="546">skip connection</text>
  <text class="sz" x="740" y="546">number = channels</text>
</svg>
