# Conda environment for cmb_3d_unet_experiments.
#   conda env create -f environment.yml        # creates "cmbx"
#   conda activate cmbx && pip install -e .
#
# PyTorch comes from the official PyTorch wheel index (CUDA 12.4 build). No CUDA toolkit is needed, only an
# NVIDIA driver >= 525 (CUDA 12 minor-version compatibility). Driver 450-524: replace "cu124" by "cu118".
# CPU-only machine: replace "cu124" by "cpu". `cmbx check-env` says which one fits.
# Behind a proxy, export http_proxy/https_proxy before running conda.
name: cmbx
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu124
      - torch==2.6.0
      - numpy>=1.26,<2.3
      - scipy>=1.11
      - nibabel>=5.0
      - scikit-image>=0.22
      - pandas>=2.0
      - pyyaml>=6.0
      - pytest>=7
