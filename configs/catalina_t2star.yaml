# In-house cohort catalina-t2star (Charité). PATIENT DATA: everything this config writes lives OUTSIDE the
# repository, in ../cmb_3d_unet_experiments_runs/ (relative to the repository root, where you run cmbx).
# Case list first (reads participants.tsv, the reference and brain masks and the bias-corrected images, honours
# excluded.tsv / duplicates.tsv, reproduces the folds of all earlier in-house results). On ALITA:
#   cmbx make-caselist --source <...>/DATA/CHARITE/BIDS_T2_STAR --modality t2star \
#        --out ../cmb_3d_unet_experiments_runs/catalina-t2star/cases.csv
# On this machine (source mirror + local derivatives):
#   cmbx make-caselist --source /home/uchralt/data/sourcedata/catalina/BIDS_T2_STAR --modality t2star \
#        --biascorr-dir /home/uchralt/data/bids/catalina-t2star/derivatives/biascorr \
#        --brainmask-dir /home/uchralt/data/bids/catalina-t2star/derivatives/brainmask \
#        --exclude-tsv /home/uchralt/data/bids/catalina-t2star/ausgeschlossen.tsv \
#        --tissue-pattern "/home/uchralt/data/work/mb-arena/synthseg-t2star/robust/{id}_synthseg.nii.gz" \
#        --out ../cmb_3d_unet_experiments_runs/catalina-t2star/cases.csv
#   cmbx run-experiment configs/catalina_t2star.yaml
# Inputs are already bias-corrected (FSL FAST -B on the brain-extracted image, done once on the data, not here).
# Preparation = cmb/transfer/build_private_grids.py of cmb-valdo-chain: RAS orientation, brain = mask & image > 0.
name: catalina_t2star_baseline
output_root: ../cmb_3d_unet_experiments_runs/catalina-t2star/runs
data:
  cases: ../cmb_3d_unet_experiments_runs/catalina-t2star/cases.csv
  prepared_dir: ../cmb_3d_unet_experiments_runs/catalina-t2star/prepared
  splits: ../cmb_3d_unet_experiments_runs/catalina-t2star/splits.json
  n_folds: 5
preprocess:
  reorient: ras
  brain_mask_mode: mask_and_positive
train:
  channels: [image, frst]
  epochs: 60
postprocess:
  csf_rule: false
